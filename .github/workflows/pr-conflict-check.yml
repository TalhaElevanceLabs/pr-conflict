name: PR Conflict Notifier

on:
  pull_request:
    types: [closed]

jobs:
  check-open-prs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read    # needed to fetch repo commits
      pull-requests: read  # needed to list PRs

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # need full history for merge-tree

      # 2️⃣ Fetch all branches
      - name: Fetch all branches
        run: git fetch --all

      # 3️⃣ Get list of open PRs using GITHUB_TOKEN
      - name: Get list of open PRs
        uses: actions/github-script@v7
        id: open_prs
        with:
          github-token: ${{ github.token }}
          script: |
            console.log("Fetching open PRs...")
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            console.log(`Found ${prs.data.length} open PR(s)`);
            return prs.data.map(pr => ({
              number: pr.number,
              head: pr.head.sha,
              base: pr.base.sha,
              user: pr.user.login,
              url: pr.html_url
            }));

      # 4️⃣ Check PRs for conflicts safely (dry merge)
      - name: Check PRs for conflicts safely
        run: |
          echo "${{ steps.open_prs.outputs.result }}" | jq -c '.[]' | while read pr; do
            number=$(echo $pr | jq -r '.number')
            head_sha=$(echo $pr | jq -r '.head')
            base_sha=$(echo $pr | jq -r '.base')
            user=$(echo $pr | jq -r '.user')
            url=$(echo $pr | jq -r '.url')

            echo "Checking PR #$number by @$user..."
            merge_output=$(git merge-tree $base_sha $base_sha $head_sha)

            if echo "$merge_output" | grep -q "<<<<<<<"; then
              echo "Conflict detected in PR #$number!"
              curl -X POST -H 'Content-Type: application/json' \
                -d "{\"text\":\":warning: PR #$number by @$user has merge conflicts! \nPR Link: $url\"}" \
                "https://chat.googleapis.com/v1/spaces/AAQAEpTbLTE/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=UsS_zXbCamHHsDZI9h0K6UTjr4vmFK1Q3S2DazCLC_Y"
            fi
          done